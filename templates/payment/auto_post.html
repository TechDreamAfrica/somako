{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Payment…</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', 'Apple Color Emoji', 'Segoe UI Emoji'; background:#f8fafc; color:#0f172a; }
    .card { max-width: 460px; margin: 12vh auto; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08); text-align:center; }
    .spinner { width:48px; height:48px; border:4px solid #e2e8f0; border-top-color:#6366f1; border-radius:50%; margin: 0 auto 16px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .muted { color:#64748b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>Redirecting to Payment</h1>
    <p class="muted">Please wait while we connect you to our secure payment gateway…</p>
    <form id="paymentForm" method="post" action="{% url action_url_name %}">
      {% csrf_token %}
      <input type="hidden" name="amount" value="{{ amount }}">
      <input type="hidden" name="source_app" value="{{ source_app }}">
      <input type="hidden" name="order_id" value="{{ order_id }}">
      <input type="hidden" name="description" value="{{ description }}">
      <input type="hidden" name="payment_method" value="{{ payment_method }}">
    </form>
  </div>
  <script>
    window.addEventListener('load', function(){ document.getElementById('paymentForm').submit(); });
  </script>
</body>
</html>
