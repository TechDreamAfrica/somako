{% extends 'base.html' %}

{% block title %}Delete {{ equipment.name }} - Soma Ko Rent{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card border-0 shadow-sm">
        <div class="card-body text-center py-5">
          <div class="mb-4">
            <i class="fas fa-exclamation-triangle text-danger fa-4x"></i>
          </div>
          <h3 class="mb-3">Delete Equipment?</h3>
          <p class="text-muted mb-4">
            Are you sure you want to delete <strong>{{ equipment.name }}</strong>?<br>
            This action cannot be undone.
          </p>
          
          <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2 justify-content-center">
              <a href="{% url 'rent:owner_equipment_detail' equipment.pk %}" class="btn btn-outline-secondary btn-lg">Cancel</a>
              <button type="submit" class="btn btn-danger btn-lg">
                <i class="fas fa-trash me-2"></i>Delete
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
